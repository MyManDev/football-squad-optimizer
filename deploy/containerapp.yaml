{
  "type": "Microsoft.App/containerApps",
  "location": "<LOCATION>",
  "properties": {
    "managedEnvironmentId": "<ENVIRONMENT_ID>",
    "configuration": {
      "activeRevisionsMode": "Single",
      "ingress": {
        "external": false,
        "targetPort": 8000,
        "transport": "auto",
        "allowInsecure": false,
        "traffic": [
          {
            "latestRevision": true,
            "weight": 100
          }
        ]
      },
      "registries": [
        {
          "server": "<REGISTRY>",
          "identity": "<PULL_IDENTITY>"
        }
      ]
    },
    "template": {
      "scale": {
        "minReplicas": 1,
        "maxReplicas": 1
      },
      "terminationGracePeriodSeconds": 180,
      "volumes": [
        {
          "name": "store",
          "storageType": "NfsAzureFile",
          "storageName": "squadopt-store"
        },
        {
          "name": "inputs",
          "storageType": "NfsAzureFile",
          "storageName": "squadopt-inputs"
        }
      ],
      "containers": [
        {
          "name": "api",
          "image": "<IMAGE>",
          "command": [
            "uvicorn"
          ],
          "args": [
            "--factory",
            "squadopt.api.runtime:build_app",
            "--host",
            "0.0.0.0",
            "--port",
            "8000"
          ],
          "resources": {
            "cpu": 0.5,
            "memory": "1.0Gi"
          },
          "volumeMounts": [
            {
              "volumeName": "store",
              "mountPath": "/mnt/squadopt-store"
            },
            {
              "volumeName": "inputs",
              "mountPath": "/mnt/squadopt-inputs"
            }
          ],
          "env": [
            {
              "name": "SQUADOPT_BACKEND_STORE_ROOT",
              "value": "/mnt/squadopt-store/store"
            },
            {
              "name": "SQUADOPT_BACKEND_SITE_DATA_ROOT",
              "value": "/mnt/squadopt-inputs/site/data"
            },
            {
              "name": "SQUADOPT_BACKEND_SNAPSHOT_ROOT",
              "value": "/mnt/squadopt-inputs/snapshots"
            },
            {
              "name": "SQUADOPT_BACKEND_HANDOFF_ROOT",
              "value": "/mnt/squadopt-inputs/handoffs"
            },
            {
              "name": "SQUADOPT_BACKEND_ALLOWED_ORIGINS",
              "value": "<ORIGINS>"
            }
          ],
          "probes": [
            {
              "type": "Liveness",
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 30
            },
            {
              "type": "Startup",
              "httpGet": {
                "path": "/health",
                "port": 8000
              },
              "failureThreshold": 10,
              "periodSeconds": 15
            }
          ]
        },
        {
          "name": "worker",
          "image": "<IMAGE>",
          "command": [
            "python"
          ],
          "args": [
            "-m",
            "squadopt.platform.advice_worker"
          ],
          "resources": {
            "cpu": 1.0,
            "memory": "2.0Gi"
          },
          "volumeMounts": [
            {
              "volumeName": "store",
              "mountPath": "/mnt/squadopt-store"
            },
            {
              "volumeName": "inputs",
              "mountPath": "/mnt/squadopt-inputs"
            }
          ],
          "env": [
            {
              "name": "SQUADOPT_BACKEND_STORE_ROOT",
              "value": "/mnt/squadopt-store/store"
            },
            {
              "name": "SQUADOPT_BACKEND_SITE_DATA_ROOT",
              "value": "/mnt/squadopt-inputs/site/data"
            },
            {
              "name": "SQUADOPT_BACKEND_SNAPSHOT_ROOT",
              "value": "/mnt/squadopt-inputs/snapshots"
            },
            {
              "name": "SQUADOPT_BACKEND_HANDOFF_ROOT",
              "value": "/mnt/squadopt-inputs/handoffs"
            },
            {
              "name": "SQUADOPT_BACKEND_ALLOWED_ORIGINS",
              "value": "<ORIGINS>"
            }
          ]
        }
      ]
    }
  },
  "name": "<APP_NAME>",
  "identity": {
    "type": "UserAssigned",
    "userAssignedIdentities": {
      "<PULL_IDENTITY>": {}
    }
  }
}
