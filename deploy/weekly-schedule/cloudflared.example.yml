# The tunnel's configuration on this host, a locally managed tunnel with the rules of
# deploy/cloudflared/config.example.yml. Copy to /etc/cloudflared/config.yml and put in the id
# `cloudflared tunnel create` printed. Nothing here is a secret; the credentials file it names
# is one, and only cloudflared reads it.
#
# Check before starting the unit:
#   cloudflared --config /etc/cloudflared/config.yml tunnel ingress validate
#   cloudflared --config /etc/cloudflared/config.yml tunnel ingress rule https://squadopt-api.mymandev.com/metrics
#   cloudflared --config /etc/cloudflared/config.yml tunnel ingress rule https://squadopt-api.mymandev.com/ready

tunnel: <TUNNEL-UUID>
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json
no-autoupdate: true

ingress:
  # /metrics and the generated api pages never leave the host.
  - hostname: squadopt-api.mymandev.com
    path: ^/(metrics|docs|redoc|openapi\.json)
    service: http_status:404
  # The api only, on IPv4 loopback; a worker's metrics port is never listed.
  - hostname: squadopt-api.mymandev.com
    service: http://127.0.0.1:8000
  - service: http_status:404
