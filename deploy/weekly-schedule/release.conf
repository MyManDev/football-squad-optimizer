# From GW11's first morning run (2026-11-13, #1243 6605005485): a run that exits 0 releases
# itself in the same tick, with no preview yes, and the advice backend follows the release on
# this host (squadopt-backend-release, which backend.sh installs). A person installs it as
# /etc/systemd/system/weekly-schedule.service.d/release.conf and runs systemctl daemon-reload
# (deploy/weekly-schedule/README.md, "Release a run"); removing it is the way back to a release
# by hand. While dry-run.conf is installed, its command leaves this variable out.
[Service]
Environment="WEEKLY_RELEASE=--release --backend host"
