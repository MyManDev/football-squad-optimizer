# The first week on a new host: every tick prints its decision and the command it would run,
# and writes, starts and posts nothing. provision.sh installs it as
# /etc/systemd/system/weekly-schedule.service.d/dry-run.conf on a host's first provisioning;
# removing it is the switch to real runs (deploy/weekly-schedule/README.md). The empty line
# clears the unit's ExecStart.
[Service]
ExecStart=
ExecStart=/srv/squadopt/weekly/.venv/bin/python -m squadopt.platform.weekly_schedule --workspace /srv/squadopt/weekly --workers ${WEEKLY_WORKERS} --dry-run
