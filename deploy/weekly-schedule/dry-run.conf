# The first week on a new host: every tick prints its decision and the command it would run,
# and writes and starts nothing. Install as
# /etc/systemd/system/weekly-schedule.service.d/dry-run.conf; removing it is the switch to
# real runs (deploy/weekly-schedule/README.md). The empty line clears the unit's ExecStart.
[Service]
ExecStart=
ExecStart=/home/squadopt/squadopt/weekly/.venv/bin/python -m squadopt.platform.weekly_schedule --workspace /home/squadopt/squadopt/weekly --dry-run
