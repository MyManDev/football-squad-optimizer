# Opt-in only after the released backend image contains requested_history_snapshot.
# '+' runs this fixed, root-owned Docker wrapper with privileges; the weekly gate
# itself still runs as squadopt. A failed copy prevents use of a stale receipt.
[Service]
ExecStartPre=+/usr/local/sbin/squadopt-requested-history
Environment=SQUADOPT_REQUESTED_HISTORY_STORE=/var/lib/squadopt/requested-history/latest.json
