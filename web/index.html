<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SquadOpt: haftalık FPL kararı." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The icon an iPhone puts on its home screen (Safari takes no SVG there) and the name
         under it. theme-color paints Safari's own bars; colourScheme.ts keeps it on the
         palette the viewer sees. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SquadOpt" />
    <meta name="theme-color" content="#ffffff" />
    <!-- The faces the first screen sets before the stylesheet has been read: body text in
         Plex Sans 400 (latin, and latin-ext for the Turkish letters) and headings in Barlow
         800. Vite rewrites these to the hashed files the stylesheet's @font-face rules name,
         so each is fetched once; the other weights load as the stylesheet asks for them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-ext-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-800-normal.woff2"
    />
    <title>SquadOpt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
