    "squadopt.data.loaders",
    "squadopt.data.adapters",
    "squadopt.data.checksums",
    "squadopt.data.tables",
    "squadopt.data.pipeline",
    "squadopt.data.source_revision",
    "squadopt.data._long_paths",
]
