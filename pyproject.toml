[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-squad-optimizer"
version = "1.0.0"
description = "Data-source-independent football squad optimization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SquadOpt" }]
dependencies = [
    "numpy>=2.0.2,<3",
    "ortools>=9.15.6755,<9.16",
    "pandas>=2.2.3,<3.1",
    "scikit-learn>=1.6,<2",
    # Already present transitively through scikit-learn, and now imported directly by the
    # team-rating study for its bounded quasi-Newton fit, so it is declared rather than
    # borrowed.
    "scipy>=1.14,<2",
]

[project.scripts]
squadopt = "squadopt.platform.cli:main"

[project.optional-dependencies]
capacity = ["psutil==7.2.2"]
api = [
    "fastapi>=0.141,<1",
    "jsonschema>=4.23,<5",
    "uvicorn>=0.52,<1",
]
dev = [
    # Declared here as well as in `llm` for one reason: `mypy --strict src` is a gate, and a
    # gate that cannot see the library it is checking is not checking it. Without this the
    # SDK would resolve to `Any` in CI and the strictest check in the repository would be
    # blind at the one call site where a wrong parameter costs a real request. Same reason
    # fastapi and jsonschema appear twice below and above.
    "anthropic>=1.4,<2",
    "fastapi>=0.141,<1",
    "httpx2>=2.12,<3",
    "import-linter>=2.0,<3",
    "jsonschema>=4.23,<5",
    "mypy>=1.14,<3",
    "pandas-stubs>=2.2.3,<3.1",
    "pytest>=8.3,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.26,<5",
]
# The model call in `squadopt.data.sources.club_news_anthropic`, and nothing else. Kept out of
# the runtime dependencies so a research-only install stays free of a network SDK, and out of
# `api` so the deployed image does not carry it: the backend answers from stored artifacts and
# never asks a model anything. `docs/architecture/backend.md` puts cloud SDKs outside the
# research engine, and this is where one goes when the weekly loop needs it.
llm = [
    "anthropic>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["squadopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "slow: solver-heavy tests that take more than about five seconds each (deselect with -m 'not slow' for the fast suite)",
    "integration: end-to-end tests under tests/integration (applied automatically by tests/conftest.py)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Type-checked against 3.13 semantics: numpy's stubs use the `type` statement (3.12+),
# so a 3.11 target cannot even parse them. The package still runs on 3.11 (CI matrix).
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/squadopt"]

# SciPy ships no type information and `scipy-stubs` is a separate, partial third-party
# package; the two call sites here are wrapped in typed helpers, so the untyped import is
# contained rather than spread.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "squadopt"
include_external_packages = false

# The layered modular monolith (docs/architecture/dependency_rules.md). Higher layers may
# import lower ones, never the reverse. There are no baseline exceptions; a new
# violation fails the gate.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "squadopt.api",
    "squadopt.platform",
    "squadopt.application",
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
]

# The product (adapters, runtime, use cases, live, planning) does not import the measurement
# laboratory. The layers contract above is a valid linear extension and stays as the
# tie-break; this contract is the rule it could not express (docs/architecture/dependency_rules.md).
[[tool.importlinter.contracts]]
name = "Product does not import the laboratory"
type = "forbidden"
source_modules = [
    "squadopt.api",
    "squadopt.platform",
    "squadopt.application",
    "squadopt.live",
    "squadopt.planning",
]
forbidden_modules = [
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.bayesopt",
    "squadopt.recalibration",
    "squadopt.preflight",
]
allow_indirect_imports = false
# Baseline, same rule as the layers contract (ADR 0001): this list may only shrink; a new
# violation fails the gate; each entry names the follow-up PR that removes it.
ignore_imports = [
    # CandidatePlan / select_plan / selection_to_dict -> squadopt.live (plan_selection PR)
    "squadopt.application.mode_selection -> squadopt.experiments.plan_selection",
]

[[tool.importlinter.contracts]]
name = "HTTP adapter uses only public boundaries"
type = "forbidden"
source_modules = ["squadopt.api"]
forbidden_modules = [
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
]
allow_indirect_imports = true
