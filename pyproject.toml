[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-squad-optimizer"
version = "0.1.0"
description = "Data-source-independent football squad optimization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SquadOpt" }]
dependencies = [
    "numpy>=2.0.2,<3",
    "ortools>=9.15.6755,<9.16",
    "pandas>=2.2.3,<3.1",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0,<3",
    "mypy>=1.14,<3",
    "pandas-stubs>=2.2.3,<3.1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["squadopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "slow: solver-heavy tests that take more than about five seconds each (deselect with -m 'not slow' for the fast suite)",
    "integration: end-to-end tests under tests/integration (applied automatically by tests/conftest.py)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Type-checked against 3.13 semantics: numpy's stubs use the `type` statement (3.12+),
# so a 3.11 target cannot even parse them. The package still runs on 3.11 (CI matrix).
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/squadopt"]

[tool.importlinter]
root_package = "squadopt"
include_external_packages = false

# The layered modular monolith (docs/architecture/dependency_rules.md). Higher layers may
# import lower ones, never the reverse. The ignore list is the measured baseline of
# violations on the day the contract was added; it may only shrink (Stage 3/4 remove
# every entry), and a new violation fails the gate.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
]
ignore_imports = [
    "squadopt.data.schema -> squadopt.optimization.config",
    "squadopt.data.schema -> squadopt.optimization.validation",
    "squadopt.prediction.integration -> squadopt.optimization.coefficients",
    "squadopt.backtest.production_benchmark -> squadopt.experiments",
    "squadopt.backtest.production_benchmark -> squadopt.experiments.config",
]
