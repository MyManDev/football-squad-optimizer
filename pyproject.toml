[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-squad-optimizer"
version = "1.0.0"
description = "Data-source-independent football squad optimization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SquadOpt" }]
dependencies = [
    "numpy>=2.0.2,<3",
    "ortools>=9.15.6755,<9.16",
    "pandas>=2.2.3,<3.1",
    "scikit-learn>=1.6,<2",
    # Already present transitively through scikit-learn, and now imported directly by the
    # team-rating study for its bounded quasi-Newton fit, so it is declared rather than
    # borrowed.
    "scipy>=1.14,<2",
]

[project.scripts]
squadopt = "squadopt.platform.cli:main"

[project.optional-dependencies]
research-bo = ["botorch==0.18.1"]
capacity = ["psutil==7.2.2"]
api = [
    "fastapi>=0.141,<1",
    "jsonschema>=4.23,<5",
    "uvicorn>=0.52,<1",
]
dev = [
    # Declared here as well as in `llm` for one reason: `mypy --strict src` is a gate, and a
    # gate that cannot see the library it is checking is not checking it. Without this the
    # SDK would resolve to `Any` in CI and the strictest check in the repository would be
    # blind at the one call site where a wrong parameter costs a real request. Same reason
    # fastapi and jsonschema appear twice below and above.
    "anthropic>=1.4,<2",
    "fastapi>=0.141,<1",
    "httpx2>=2.12,<3",
    "import-linter>=2.0,<3",
    "jsonschema>=4.23,<5",
    "mypy>=1.14,<3",
    "pandas-stubs>=2.2.3,<3.1",
    "pytest>=8.3,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.26,<5",
]
# The model call in `squadopt.platform.club_news_model`, and nothing else. Kept out of
# the runtime dependencies so a research-only install stays free of a network SDK, and out of
# `api` so the deployed image does not carry it: the backend answers from stored artifacts and
# never asks a model anything. `docs/architecture/backend.md` puts cloud SDKs outside the
# research engine, and this is where one goes when the weekly loop needs it.
llm = [
    "anthropic>=1.4,<2",
    # The second adapter speaks to its service over one REST call rather than through a
    # vendor SDK, so the HTTP client is the dependency that adapter needs. Pinned already
    # in constraints.txt for the dev extra; naming it here is what makes a plain
    # `.[llm]` install able to code a week.
    "httpx2>=2.12,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["squadopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "slow: solver-heavy tests that take more than about five seconds each (deselect with -m 'not slow' for the fast suite)",
    "integration: end-to-end tests under tests/integration (applied automatically by tests/conftest.py)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Type-checked against 3.13 semantics: numpy's stubs use the `type` statement (3.12+),
# so a 3.11 target cannot even parse them. The package still runs on 3.11 (CI matrix).
python_version = "3.13"
strict = true
mypy_path = "src"
# The package, the operator scripts, and the three thin shells that write the published
# site, league and scoreboard trees (`platform/weekly_publish.py` still runs them).
files = [
    "src/squadopt",
    "scripts/backend_status.py",
    "scripts/release/verify_live.py",
    "scripts/check_league_tree.py",
    "scripts/release/clean_body.py",
    "scripts/build_site.py",
    "scripts/build_league_site.py",
    "scripts/build_scoreboard.py",
]

# SciPy ships no type information and `scipy-stubs` is a separate, partial third-party
# package; the two call sites here are wrapped in typed helpers, so the untyped import is
# contained rather than spread.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "squadopt"
# The graph carries imports of modules outside the package, so the contracts below can name
# frameworks, network clients and OS modules as well as squadopt packages.
include_external_packages = true

# The layered modular monolith (docs/architecture/dependency_rules.md). Higher layers may
# import lower ones, never the reverse. There are no baseline exceptions; a new
# violation fails the gate. `exhaustive` means every package directly under `squadopt` must
# be named here, so a new one fails the gate until it is placed. `integration` imports only
# `data` and `optimization`, so it sits directly above `optimization`.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["squadopt"]
exhaustive = true
layers = [
    "api",
    "platform",
    "application",
    "live",
    "experiments",
    "backtest",
    "recalibration",
    "preflight",
    "bayesopt",
    "planning",
    "risk",
    "scenarios",
    "uncertainty",
    "evaluation",
    "integration",
    "optimization",
    "prediction",
    "features",
    "data",
    "contracts",
]

# Neither the product nor the domain imports the measurement laboratory. The layers contract
# above is a valid linear extension and stays as the tie-break; this contract is the rule it
# could not express (docs/architecture/dependency_rules.md). Every package outside the
# laboratory is a source, so the rule does not depend on the layer order: `scenarios` sits
# above `uncertainty` there, and only this contract refuses that import.
[[tool.importlinter.contracts]]
name = "Product does not import the laboratory"
type = "forbidden"
source_modules = [
    "squadopt.api",
    "squadopt.platform",
    "squadopt.application",
    "squadopt.live",
    "squadopt.planning",
    "squadopt.scenarios",
    "squadopt.optimization",
    "squadopt.evaluation",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
    "squadopt.integration",
]
forbidden_modules = [
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.bayesopt",
    "squadopt.recalibration",
    "squadopt.preflight",
    # Laboratory by use, not by name. Outside its own package nothing under src imports
    # `risk` at all, and `uncertainty` is imported only by `risk` and by one experiments
    # module, so both are research surfaces the contract classified as product. Listing them
    # costs no import change today and refuses the first product import rather than the
    # ninth, which is the lesson ADR 0001 recorded when the original eight were removed.
    "squadopt.risk",
    "squadopt.uncertainty",
]
allow_indirect_imports = false
# No baseline: the eight original ignore_imports entries have all been removed (ADR 0001);
# a new violation fails the gate.

[[tool.importlinter.contracts]]
name = "HTTP adapter uses only public boundaries"
type = "forbidden"
source_modules = ["squadopt.api"]
forbidden_modules = [
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
]
allow_indirect_imports = true

# Frameworks, network clients and databases stay in the outer ring: only the HTTP adapter and
# the platform import them (docs/architecture/platform_runtime.md, "Infrastructure
# dependencies stop at the platform boundary"). An import inside a function counts, so an SDK
# import deferred into a constructor is still refused. `subprocess` is not listed because
# `data/source_revision.py` asks git for the commit it stamps.
[[tool.importlinter.contracts]]
name = "Frameworks, network and databases stay in api and platform"
type = "forbidden"
source_modules = [
    "squadopt.application",
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.integration",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "anthropic",
    "openai",
    "google",
    "httpx",
    "httpx2",
    "requests",
    "aiohttp",
    "urllib",
    "http",
    "socket",
    "sqlite3",
]

# The installed package never depends on the repository's script shells
# (docs/architecture/platform_runtime.md: platform code never reaches into `scripts/`). This
# is the import half of that rule; it does not see a `python -m scripts.<name>` subprocess.
[[tool.importlinter.contracts]]
name = "The package never imports the repository scripts"
type = "forbidden"
source_modules = [
    "squadopt.api",
    "squadopt.platform",
    "squadopt.application",
    "squadopt.live",
    "squadopt.experiments",
    "squadopt.backtest",
    "squadopt.recalibration",
    "squadopt.preflight",
    "squadopt.bayesopt",
    "squadopt.planning",
    "squadopt.risk",
    "squadopt.scenarios",
    "squadopt.uncertainty",
    "squadopt.evaluation",
    "squadopt.integration",
    "squadopt.optimization",
    "squadopt.prediction",
    "squadopt.features",
    "squadopt.data",
    "squadopt.contracts",
]
forbidden_modules = ["scripts"]

# The decision core computes; it does not touch the operating system or start processes.
# Reading a file through pathlib or json is outside this rule, and the contract does not
# claim it. Indirect imports count (the forbidden-contract default), so a `data`, `features`
# or `prediction` module the core imports is held to the rule through that import.
# `prediction` and `features` are not sources in their own right: that would be a new rule in
# the data and prediction lane and waits for that owner's agreement.
[[tool.importlinter.contracts]]
name = "The decision core imports no OS or process module"
type = "forbidden"
source_modules = [
    "squadopt.contracts",
    "squadopt.optimization",
    "squadopt.planning",
    "squadopt.scenarios",
    "squadopt.evaluation",
    "squadopt.uncertainty",
    "squadopt.risk",
]
forbidden_modules = ["os", "shutil", "tempfile", "subprocess"]
