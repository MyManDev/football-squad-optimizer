name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# One run per pull-request head (a newer push cancels the older run), but every push to
# develop/main gets its own run: two merges in quick succession must not leave the earlier
# one "cancelled" and the branch history looking red.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # 3.13 reproduces the measurement environment exactly (constraints.txt: numpy 2.5
      # has no 3.11 wheels); 3.11 installs the declared ranges and proves the floor.
      - name: Install (pinned measurement environment)
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[api,dev]"

      - name: Install (declared ranges)
        if: matrix.python-version != '3.13'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy (strict, src)
        run: python -m mypy --strict src

      - name: Import boundaries
        run: lint-imports

      # `--dist loadscope` groups a module onto one worker, so the eleven module-scoped
      # fixtures are built once rather than per worker. Measured faster than the default
      # `load` here; see docs/architecture/branching.md for the numbers.
      - name: Pytest (full suite is the merge gate)
        run: python -m pytest -q -p no:cacheprovider -n auto --dist loadscope --durations=15

  # The image the deployment runs, built and exercised once per commit. Not folded into the
  # matrix above: the artifact does not vary by the interpreter CI happens to install, and a
  # second copy of a four-minute build would buy nothing. Not a required check yet either —
  # branch protection lists only the two gate contexts, so adding this one there is a
  # separate, deliberate change.
  container:
    name: container (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The commit that is actually being built. On a pull request `actions/checkout` leaves
      # the merge ref in the working tree, so `git rev-parse HEAD` is the tree the image
      # contains; the pull request's head sha names different code.
      - name: Build the image
        run: |
          docker build --platform linux/amd64 \
            --build-arg SQUADOPT_REPOSITORY_COMMIT="$(git rev-parse HEAD)" \
            --tag squadopt-backend:ci .

      # Recorded in the log, because a tag is not an identity: a rollback needs the digest and
      # an operator needs to know which interpreter and which pins answered.
      - name: Image identity
        run: |
          docker image inspect --format \
            'id={{.Id}} arch={{.Architecture}}/{{.Os}} bytes={{.Size}}' squadopt-backend:ci
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            squadopt-backend:ci | grep '^SQUADOPT_REPOSITORY_COMMIT='
          docker run --rm squadopt-backend:ci id
          docker run --rm squadopt-backend:ci python -VV
          docker run --rm squadopt-backend:ci python -m pip freeze

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install (pinned measurement environment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[api,dev]"

      # One entry point, opt-in by an environment variable so the gate jobs above — which run
      # the whole suite — never try to reach a Docker daemon. Serial: xdist workers would
      # contend for the daemon and for the published port.
      - name: Container smoke
        env:
          SQUADOPT_CONTAINER_SMOKE: "1"
          SQUADOPT_CONTAINER_IMAGE: squadopt-backend:ci
        run: >-
          python -m pytest tests/integration/test_backend_container.py -q -p no:cacheprovider
          --basetemp .pt/ci-container -rA

      - name: Retain container failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-failure
          path: .pt/ci-container
          retention-days: 7

  web:
    name: web (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install publication and backend acceptance dependencies
        working-directory: .
        run: python -m pip install -c constraints.txt -e ".[api,dev]"

      - name: Types match the committed contract
        run: |
          npm run gen:types
          git diff --exit-code -- src/data/schema.ts

      - name: Lint and format
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Deployment assets
        run: npm run check:deployment

      - name: Bundle budget
        run: npm run size

      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # The GitHub Ubuntu image already ships Chrome's shared libraries, so the browser
      # alone is enough; `--with-deps` runs apt-get, which has hung for 8+ minutes here.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install chromium

      - name: Playwright smoke
        timeout-minutes: 8
        run: npm run e2e

      - name: Python publication and browser API worker acceptance
        working-directory: .
        timeout-minutes: 8
        env:
          SQUADOPT_PUBLICATION_CONTRACT: "1"
          SQUADOPT_BROWSER_SMOKE: "1"
        run: >-
          python -m pytest tests/integration/test_publication_contract.py
          tests/integration/test_advice_browser.py -q -p no:cacheprovider
          --basetemp .pt/ci-backend -rA

      - name: Retain browser and backend failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-backend-failure
          path: |
            web/test-results
            web/playwright-report
            .pt/ci-backend
          retention-days: 7

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/dist
          retention-days: 7
